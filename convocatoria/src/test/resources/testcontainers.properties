# WORKAROUND, no fix de causa raíz — ver documento-maestro-proyecto.md sección 9.1.
# Testcontainers negocia correctamente v1.41 en `crypto` sin esta propiedad, pero
# falla consistentemente a un fallback de v1.32 en `app` bajo condiciones
# aparentemente idénticas (misma versión de testcontainers/docker-java 1.20.6/3.4.1,
# mismas variables de entorno, mismo testcontainers.properties base). Investigado
# exhaustivamente (env vars, properties, árboles de dependencia verbose) sin
# encontrar la diferencia causal. Se fija explícitamente al mismo valor que
# `crypto` negocia nativamente, dentro del rango soportado por el daemon
# (Api-Version: 1.55, mínimo 1.40 según el propio error del daemon).
docker.api.version=1.41
