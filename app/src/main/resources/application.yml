spring:
  application:
    name: traceability-engine

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:dummy}
      base-url: https://api.groq.com/openai
      chat:
        options:
          model: llama3-8b-8192

  data:
    mongodb:
      auto-index-creation: true

crypto:
  # ── Node connection & wallet credentials ─────────────────────────────────────
  # Consumed by Web3Configuration (@ConfigurationProperties prefix = "crypto.web3j")
  # MUST be overridden via environment variables — never commit real values here
  web3j:
    private-key: ${WEB3_PRIVATE_KEY:}
    node-url: ${WEB3_NODE_URL:}

  # ── Operational anchor settings ──────────────────────────────────────────────
  anchor:
    network: ${CRYPTO_ANCHOR_NETWORK:sepolia}
    smart-contract: ${CRYPTO_ANCHOR_SMART_CONTRACT:0x0000000000000000000000000000000000000000}
    chain-id: ${CRYPTO_ANCHOR_CHAIN_ID:11155111}
    confirmations-required: ${CRYPTO_ANCHOR_CONFIRMATIONS_REQUIRED:12}
    stuck-timeout-seconds: 3600
    receipt-timeout-seconds: 3600
    submit:
      delay: 30000
      timeout-seconds: 15
    poll:
      delay: 15000
    stuck-monitor:
      delay: 300000
    gas:
      max-fee-per-gas-cap: 100000000000
    collecting-recovery:
      timeout-seconds: ${CRYPTO_ANCHOR_COLLECTING_RECOVERY_TIMEOUT_SECONDS:300}
      max-per-cycle: ${CRYPTO_ANCHOR_COLLECTING_RECOVERY_MAX_PER_CYCLE:10}
      warn-after-attempts: ${CRYPTO_ANCHOR_COLLECTING_RECOVERY_WARN_AFTER_ATTEMPTS:5}

traceability:
  web:
    cors:
      # S-03: orígenes exactos (desarrollo y demo) separados por comas; nunca '*'. Sin valor, ningún origen cruzado.
      allowed-origins: ${TRACEABILITY_CORS_ALLOWED_ORIGINS:}
  discovery:
    # DD-53: clave AES-256 del cursor opaco del descubrimiento (32 bytes en Base64). Obligatoria y sin valor por
    # defecto: sin TRACEABILITY_DISCOVERY_CURSOR_KEY, o igual a otro secreto, la aplicación no arranca.
    cursor-key: ${TRACEABILITY_DISCOVERY_CURSOR_KEY}
  # Enmienda 3 de ADR-037, D6 y E3-Q3 (Carlos, 2026-10-07): el trackingCode dura un año desde fundsAppliedAt
  tracking-code:
    ttl: P365D
  # Proveedor de pago simulado: apagado por defecto (E3-Q1). Solo application-dev.yml lo activa.
  demo:
    simulated-payments: false
  audit:
    thresholds:
      dispatched-to-received: 259200
      dispatched-to-delivered: 172800
      received-to-delivered: 172800
  security:
    tracking-code-secret: ${TRACKING_CODE_SECRET}
    asset-ref-secret: ${ASSET_REF_SECRET}
    # ADR-047: sin valor por defecto; la aplicación no arranca sin JWT_SIGNING_SECRET (>= 32 bytes)
    jwt:
      signing-secret: ${JWT_SIGNING_SECRET}
      kid: ${JWT_SIGNING_KID:k1}
      ttl: ${JWT_TTL:PT8H}
      clock-skew: PT30S
      # Rotación (D4): las tres van juntas; ACCEPT_UNTIL no puede pasar de arranque + ttl
      previous-signing-secret: ${JWT_SIGNING_SECRET_PREVIOUS:}
      previous-kid: ${JWT_SIGNING_KID_PREVIOUS:}
      previous-accept-until: ${JWT_SIGNING_SECRET_PREVIOUS_ACCEPT_UNTIL:}

convocatoria:
  donation-intent:
    # Duración de la intención BANK_TRANSFER: parámetro de implementación sin valor decidido
    # (implementation_plan.md §9). Sin default a propósito: debe fijarse por entorno.
    bank-transfer-expiration: ${CONVOCATORIA_BANK_TRANSFER_EXPIRATION}
  funds-application:
    recovery:
      # Scheduler de respaldo de ADR-045 §2.2. Deshabilitado por defecto, también en producción: no se habilita
      # el dinero real sin P1 (Enmienda 2 §4). El disparo inmediato tras confirmar no depende de esta propiedad.
      enabled: ${CONVOCATORIA_FUNDS_APPLICATION_RECOVERY_ENABLED:false}
      fixed-delay: PT1M
      initial-delay: PT1M
      batch-size: 50
      retry-window: PT4H          # aprobado en ADR-045 §2.3 (como ADR-010)
      max-attempts: 10            # valor de implementación (ADR-045 §7)
