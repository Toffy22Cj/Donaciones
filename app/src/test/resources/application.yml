# Correo de los tests (ADR-049): un servidor que no existe; los tests que envían sustituyen JavaMailSender o usan
# Mailpit por Testcontainers.
spring:
  mail:
    host: localhost
    port: 1
  # ADR-051 F8: los mismos límites multipart que application.yml (este fichero lo sustituye en los tests)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

traceability:
  # ADR-050 D2: versiones iniciales indicadas por Carlos (2026-10-24)
  legal:
    terms-version: v1-2026-10
    data-policy-version: v1-2026-10
    organization-terms-version: v1-2026-10
  mail:
    from: no-reply@tests.paxfide.local
  web:
    base-url: https://web.tests.paxfide.local
  security:
    tracking-code-secret: dummy-tracking-code-secret-for-test
    asset-ref-secret: dummy-asset-ref-secret-for-test
    jwt:
      # Solo para tests; nunca un valor productivo (ADR-047 D3)
      signing-secret: test-only-jwt-signing-secret-not-for-production
      kid: test-k1
  # ADR-051 F1: S3 ficticio solo para tests (no es dev, así que local no se admite). Nadie escucha en localhost:1: los
  # tests que guardan imágenes usan el adaptador en memoria o MinIO por Testcontainers. Nunca valores productivos.
  media:
    storage: s3
    s3:
      endpoint: http://localhost:1
      region: us-east-1
      bucket: tests-media
      access-key-id: test-only-media-access-key-id
      secret-access-key: test-only-media-secret-not-for-production
  discovery:
    # Solo para tests (32 bytes en Base64): "test-only-discovery-cursor-key!!"
    cursor-key: dGVzdC1vbmx5LWRpc2NvdmVyeS1jdXJzb3Ita2V5ISE=

convocatoria:
  donation-intent:
    bank-transfer-expiration: PT72H
